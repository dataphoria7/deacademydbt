version: 2

sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW

  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC

  - name: sales_input #this is arbitrary name grouping
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC # it is matching the actual Snowflake raw source name
  
  - name: product 
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC # it is matching the actual Snowflake raw source name

  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC # it is matching the actual Snowflake raw source name
  
  - name: clean_orders
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS # it is matching the actual Snowflake raw source name

models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1','2','3','4','5']
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          - salary_check

  - name: customer
    description: "DBT Model for the customer table"
  
  - name: customer_vw
    description: "DBT Model for the customer view"  
  
  - name: sales #dbt will take it from the demo .sql file. Can be overwriten but nobody does.
    description: "DBT Model for the sales table"   
  
  - name: product 
    description: "DBT Model for the products table"  

  - name: purchase 
    description: "DBT Model for the purchase table" 
  
  - name: clean_orders 
    description: "DBT ephemeral Model for the clean orders" 